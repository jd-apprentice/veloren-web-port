[package]
name = "poc1-wgpu-triangle"
version = "0.1.0"
edition = "2021"

# Standalone workspace so it is not absorbed by any ancestor workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "27"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
] }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
naga = { version = "27", features = ["glsl-in", "wgsl-out"] }
