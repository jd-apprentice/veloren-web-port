[package]
name = "poc3-assets-wasm"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veloren-common-assets = { path = "/home/dyallo/orca/projects/veloren/spikes/vendor/veloren/common/assets" }
assets_manager = { version = "0.13", features = ["ab_glyph", "bincode", "ron", "json"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Response", "Location", "console"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
